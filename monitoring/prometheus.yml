global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # OpenMRS Communicatiemodule backend (.NET OpenTelemetry Prometheus exporter)
  - job_name: openmrs-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: openmrs-module-backend

  # Prometheus zelf
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # RabbitMQ (ingebouwde rabbitmq_prometheus-plugin op poort 15692)
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
