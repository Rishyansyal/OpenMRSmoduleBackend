<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="980" viewBox="0 0 1680 980">
  
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 5 L 0 10 z" fill="#707070" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  
    <rect x="60" y="140" width="1250" height="700" rx="0" fill="none" stroke="#999999" stroke-width="2" stroke-dasharray="9 9"/>
    <text x="70" y="806" text-anchor="start" style="font-size:13px;font-weight:700;fill:#333333;font-style:normal">OpenMRS Appointment Reminder Platform</text>
    <text x="70" y="824" text-anchor="start" style="font-size:10px;font-weight:400;fill:#333333;font-style:italic">[Software System]</text>
  <path d="M 380 270 L 505 275" fill="none" stroke="#707070" stroke-width="2" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
<path d="M 380 270 L 430 160 L 840 160 L 880 270" fill="none" stroke="#707070" stroke-width="2" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
<path d="M 1005 330 L 1005 520" fill="none" stroke="#707070" stroke-width="2" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
<path d="M 880 580 L 775 580" fill="none" stroke="#707070" stroke-width="2" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
<path d="M 1130 580 L 1375 480" fill="none" stroke="#707070" stroke-width="2" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
<path d="M 1500 540 L 1500 650" fill="none" stroke="#707070" stroke-width="2" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
<path d="M 880 580 L 650 740 L 640 340" fill="none" stroke="#707070" stroke-width="2" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
  
    <g id="scheduler">
      <rect x="130" y="210" width="250" height="120" rx="0" fill="#85bb57" stroke="#85bb57" stroke-width="2"/>
      <text x="255" y="250" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#ffffff;font-style:normal">Reminder Scheduler</text>
      <text x="255" y="272" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#ffffff;font-style:italic">[Component: BackgroundService]</text>
      <text x="255" y="294" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">Claims due reminders.</text>
    </g>

    <g id="db">
      
    <path d="M 513 232 C 513 214, 767 214, 767 232
             L 767 318
             C 767 336, 513 336, 513 318
             Z" fill="#85bb57" stroke="#85bb57" stroke-width="2"/>
    <ellipse cx="640" cy="232" rx="127" ry="18" fill="#85bb57" stroke="#85bb57" stroke-width="2"/>
    <ellipse cx="640" cy="232" rx="127" ry="18" fill="none" stroke="rgba(0,0,0,0.16)" stroke-width="1"/>
      <text x="640" y="250" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#ffffff;font-style:normal">Communication Database</text>
      <text x="640" y="272" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#ffffff;font-style:italic">[Container: PostgreSQL]</text>
      <text x="640" y="294" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">Schedule, retry ledger,</text>
<text x="640" y="308" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">audit logs.</text>
    </g>

    <g id="rabbit">
      <rect x="880" y="210" width="250" height="120" rx="0" fill="#85bb57" stroke="#85bb57" stroke-width="2"/>
      <text x="1005" y="250" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#ffffff;font-style:normal">RabbitMQ</text>
      <text x="1005" y="272" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#ffffff;font-style:italic">[Container: Message Broker]</text>
      <text x="1005" y="294" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">Transports reminder command.</text>
    </g>

    <g id="consumer">
      <rect x="880" y="520" width="250" height="120" rx="0" fill="#85bb57" stroke="#85bb57" stroke-width="2"/>
      <text x="1005" y="560" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#ffffff;font-style:normal">Reminder Consumer</text>
      <text x="1005" y="582" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#ffffff;font-style:italic">[Component: MassTransit]</text>
      <text x="1005" y="604" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">Sends reminder and records</text>
<text x="1005" y="618" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">result.</text>
    </g>

    <g id="openmrs">
      <rect x="505" y="520" width="270" height="120" rx="0" fill="#85bb57" stroke="#85bb57" stroke-width="2"/>
      <text x="640" y="560" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#ffffff;font-style:normal">OpenMRS Backend</text>
      <text x="640" y="582" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#ffffff;font-style:italic">[Container: FHIR R4 API]</text>
      <text x="640" y="604" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">Returns current patient</text>
<text x="640" y="618" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">contact.</text>
    </g>

    <g id="provider">
      <rect x="1375" y="420" width="250" height="120" rx="0" fill="#999999" stroke="#999999" stroke-width="2"/>
      <text x="1500" y="460" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#ffffff;font-style:normal">Messaging provider API</text>
      <text x="1500" y="482" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#ffffff;font-style:italic">[External Software System]</text>
      <text x="1500" y="504" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">Selected provider only.</text>
    </g>

    <circle cx="1500" cy="684" r="32" fill="#438d12" stroke="#438d12" stroke-width="2"/>
    <rect x="1406" y="722" width="188" height="88" rx="42" fill="#438d12" stroke="#438d12" stroke-width="2"/>
    <text x="1500" y="756" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#ffffff;font-style:normal">Patient</text>
    <text x="1500" y="777" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#ffffff;font-style:italic">[Person]</text>
    <text x="1500" y="798" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">Receives reminder.</text>
  <g>
      <text x="445" y="245" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">1: Claims due reminder</text>
      <text x="445" y="259" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#333333;font-style:italic">[SQL/TCP]</text>
    </g>
<g>
      <text x="650" y="150" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">2: Publishes</text>
<text x="650" y="164" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">SendReminderCommand</text>
      <text x="650" y="178" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#333333;font-style:italic">[AMQP]</text>
    </g>
<g>
      <text x="1005" y="420" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">3: Delivers command</text>
      <text x="1005" y="434" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#333333;font-style:italic">[AMQP]</text>
    </g>
<g>
      <text x="815" y="550" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">4: Reads patient contact</text>
      <text x="815" y="564" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#333333;font-style:italic">[HTTPS/FHIR]</text>
    </g>
<g>
      <text x="1260" y="500" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">5: Sends selected provider</text>
<text x="1260" y="514" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">request</text>
      <text x="1260" y="528" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#333333;font-style:italic">[HTTPS JSON/XML]</text>
    </g>
<g>
      <text x="1500" y="610" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">6: Delivers reminder</text>
      <text x="1500" y="624" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#333333;font-style:italic">[SMS/email]</text>
    </g>
<g>
      <text x="675" y="700" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">7: Records result, retry, or</text>
<text x="675" y="714" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">dead-letter</text>
      <text x="675" y="728" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#333333;font-style:italic">[SQL/TCP]</text>
    </g>
  <text x="20" y="928" text-anchor="start" style="font-size:19px;font-weight:700;fill:#333333;font-style:normal">Dynamic View: Due reminder delivery and retry</text>
  <text x="20" y="950" text-anchor="start" style="font-size:11px;font-weight:400;fill:#707070;font-style:normal">Provider fallback is intentionally absent; retries use the selected organization provider.</text>
</svg>