<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="1180" viewBox="0 0 1780 1180">
  
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 5 L 0 10 z" fill="#707070" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  
    <rect x="60" y="190" width="1420" height="875" rx="0" fill="none" stroke="#999999" stroke-width="2" stroke-dasharray="9 9"/>
    <text x="70" y="1031" text-anchor="start" style="font-size:13px;font-weight:700;fill:#333333;font-style:normal">OpenMRS Appointment Reminder Platform</text>
    <text x="70" y="1049" text-anchor="start" style="font-size:10px;font-weight:400;fill:#333333;font-style:italic">[Software System]</text>
  <path d="M 190 170 L 295 245" fill="none" stroke="#707070" stroke-width="2" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
<path d="M 480 170 L 480 210 L 1170 210 L 1170 470" fill="none" stroke="#707070" stroke-width="2" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
<path d="M 295 390 L 295 470" fill="none" stroke="#707070" stroke-width="2" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
<path d="M 445 317.5 L 705 470" fill="none" stroke="#707070" stroke-width="2" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
<path d="M 295 470 L 295 390" fill="none" stroke="#707070" stroke-width="2" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
<path d="M 705 615 L 705 730" fill="none" stroke="#707070" stroke-width="2" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
<path d="M 865 542.5 L 990 547.5" fill="none" stroke="#707070" stroke-width="2" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
<path d="M 990 547.5 L 865 542.5" fill="none" stroke="#707070" stroke-width="2" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
<path d="M 1170 625 L 1170 730" fill="none" stroke="#707070" stroke-width="2" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
<path d="M 1170 470 L 1170 390" fill="none" stroke="#707070" stroke-width="2" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
<path d="M 1350 547.5 L 1530 542.5" fill="none" stroke="#707070" stroke-width="2" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
<path d="M 1645 615 L 1640 735" fill="none" stroke="#707070" stroke-width="2" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
  
    <circle cx="190" cy="54" r="32" fill="#438d12" stroke="#438d12" stroke-width="2"/>
    <rect x="96" y="92" width="188" height="78" rx="42" fill="#438d12" stroke="#438d12" stroke-width="2"/>
    <text x="190" y="126" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#ffffff;font-style:normal">Clinician</text>
    <text x="190" y="147" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#ffffff;font-style:italic">[Person]</text>
    <text x="190" y="168" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">Uses OpenMRS O3.</text>

    <circle cx="480" cy="54" r="32" fill="#438d12" stroke="#438d12" stroke-width="2"/>
    <rect x="386" y="92" width="188" height="78" rx="42" fill="#438d12" stroke="#438d12" stroke-width="2"/>
    <text x="480" y="126" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#ffffff;font-style:normal">System administrator</text>
    <text x="480" y="147" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#ffffff;font-style:italic">[Person]</text>
    <text x="480" y="168" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">Operates the backend.</text>

    <circle cx="1640" cy="769" r="32" fill="#438d12" stroke="#438d12" stroke-width="2"/>
    <rect x="1546" y="807" width="188" height="78" rx="42" fill="#438d12" stroke="#438d12" stroke-width="2"/>
    <text x="1640" y="841" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#ffffff;font-style:normal">Patient</text>
    <text x="1640" y="862" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#ffffff;font-style:italic">[Person]</text>
    <text x="1640" y="883" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">Receives reminders.</text>

    <g id="gateway">
      <rect x="145" y="245" width="300" height="145" rx="0" fill="#85bb57" stroke="#85bb57" stroke-width="2"/>
      <text x="295" y="288.5" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#ffffff;font-style:normal">OpenMRS Gateway</text>
      <text x="295" y="310.5" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#ffffff;font-style:italic">[Container: Nginx]</text>
      <text x="295" y="332.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">Routes /openmrs browser and</text>
<text x="295" y="346.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">API traffic.</text>
    </g>

    <g id="spa">
      <rect x="145" y="470" width="300" height="145" rx="0" fill="#85bb57" stroke="#85bb57" stroke-width="2"/>
      <text x="295" y="513.5" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#ffffff;font-style:normal">OpenMRS O3 Frontend</text>
      <text x="295" y="535.5" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#ffffff;font-style:italic">[Container: JavaScript SPA]</text>
      <text x="295" y="557.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">Clinical EMR user interface.</text>
    </g>

    <g id="openmrs">
      <rect x="545" y="470" width="320" height="145" rx="0" fill="#85bb57" stroke="#85bb57" stroke-width="2"/>
      <text x="705" y="513.5" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#ffffff;font-style:normal">OpenMRS Backend</text>
      <text x="705" y="535.5" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#ffffff;font-style:italic">[Container: Java/Tomcat, OMOD]</text>
      <text x="705" y="557.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">OpenMRS APIs and appointment</text>
<text x="705" y="571.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">webhook module.</text>
    </g>

    <g id="openmrsdb">
      
    <path d="M 553 752 C 553 734, 857 734, 857 752
             L 857 858
             C 857 876, 553 876, 553 858
             Z" fill="#85bb57" stroke="#85bb57" stroke-width="2"/>
    <ellipse cx="705" cy="752" rx="152" ry="18" fill="#85bb57" stroke="#85bb57" stroke-width="2"/>
    <ellipse cx="705" cy="752" rx="152" ry="18" fill="none" stroke="rgba(0,0,0,0.16)" stroke-width="1"/>
      <text x="705" y="775" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#ffffff;font-style:normal">OpenMRS Database</text>
      <text x="705" y="797" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#ffffff;font-style:italic">[Container: MariaDB]</text>
      <text x="705" y="819" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">Clinical and OpenMRS</text>
<text x="705" y="833" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">configuration data.</text>
    </g>

    <g id="api">
      <rect x="990" y="470" width="360" height="155" rx="0" fill="#85bb57" stroke="#85bb57" stroke-width="2"/>
      <text x="1170" y="516.5" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#ffffff;font-style:normal">Communication Backend</text>
      <text x="1170" y="538.5" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#ffffff;font-style:italic">[Container: ASP.NET Core .NET 10]</text>
      <text x="1170" y="560.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">REST API, webhook processing, workers,</text>
<text x="1170" y="574.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">consumers, retention, and metrics.</text>
    </g>

    <g id="pg">
      
    <path d="M 998 752 C 998 734, 1342 734, 1342 752
             L 1342 858
             C 1342 876, 998 876, 998 858
             Z" fill="#85bb57" stroke="#85bb57" stroke-width="2"/>
    <ellipse cx="1170" cy="752" rx="172" ry="18" fill="#85bb57" stroke="#85bb57" stroke-width="2"/>
    <ellipse cx="1170" cy="752" rx="172" ry="18" fill="none" stroke="rgba(0,0,0,0.16)" stroke-width="1"/>
      <text x="1170" y="775" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#ffffff;font-style:normal">Communication Database</text>
      <text x="1170" y="797" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#ffffff;font-style:italic">[Container: PostgreSQL]</text>
      <text x="1170" y="819" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">Identity, configuration, reminders,</text>
<text x="1170" y="833" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">retry ledger, templates, and audit</text>
<text x="1170" y="847" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">logs.</text>
    </g>

    <g id="rabbit">
      <rect x="990" y="245" width="360" height="145" rx="0" fill="#85bb57" stroke="#85bb57" stroke-width="2"/>
      <text x="1170" y="288.5" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#ffffff;font-style:normal">Reminder Message Broker</text>
      <text x="1170" y="310.5" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#ffffff;font-style:italic">[Container: RabbitMQ]</text>
      <text x="1170" y="332.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">Durable MassTransit command</text>
<text x="1170" y="346.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">transport.</text>
    </g>

    <g id="providers">
      <rect x="1530" y="470" width="230" height="145" rx="0" fill="#999999" stroke="#999999" stroke-width="2"/>
      <text x="1645" y="513.5" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#ffffff;font-style:normal">Messaging provider APIs</text>
      <text x="1645" y="535.5" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#ffffff;font-style:italic">[External Software System]</text>
      <text x="1645" y="557.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">SwiftSend, SecurePost,</text>
<text x="1645" y="571.5" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">LegacyLink, AsyncFlow.</text>
    </g>
  <g>
      <text x="255" y="205" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">Uses OpenMRS O3</text>
      <text x="255" y="219" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#333333;font-style:italic">[HTTPS]</text>
    </g>
<g>
      <text x="810" y="205" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">Manages operations</text>
      <text x="810" y="219" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#333333;font-style:italic">[HTTPS/JWT]</text>
    </g>
<g>
      <text x="245" y="430" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">Serves SPA</text>
      <text x="245" y="444" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#333333;font-style:italic">[HTTP]</text>
    </g>
<g>
      <text x="575" y="330" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">Routes OpenMRS APIs</text>
      <text x="575" y="344" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#333333;font-style:italic">[HTTP]</text>
    </g>
<g>
      <text x="355" y="430" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">Calls APIs through</text>
<text x="355" y="444" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">gateway</text>
      <text x="355" y="458" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#333333;font-style:italic">[HTTP]</text>
    </g>
<g>
      <text x="710" y="670" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">Reads and writes</text>
<text x="710" y="684" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">clinical data</text>
      <text x="710" y="698" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#333333;font-style:italic">[JDBC]</text>
    </g>
<g>
      <text x="930" y="485" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">Posts signed appointment</text>
<text x="930" y="499" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">events</text>
      <text x="930" y="513" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#333333;font-style:italic">[HTTPS/JSON + HMAC]</text>
    </g>
<g>
      <text x="930" y="585" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">Reads patient and</text>
<text x="930" y="599" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">appointment data</text>
      <text x="930" y="613" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#333333;font-style:italic">[FHIR R4 + REST]</text>
    </g>
<g>
      <text x="1180" y="680" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">Persists backend state</text>
      <text x="1180" y="694" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#333333;font-style:italic">[SQL/TCP]</text>
    </g>
<g>
      <text x="1170" y="430" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">Publishes and consumes</text>
<text x="1170" y="444" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">commands</text>
      <text x="1170" y="458" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#333333;font-style:italic">[AMQP]</text>
    </g>
<g>
      <text x="1440" y="520" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">Sends selected provider</text>
<text x="1440" y="534" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">request</text>
      <text x="1440" y="548" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#333333;font-style:italic">[HTTPS JSON/XML]</text>
    </g>
<g>
      <text x="1645" y="670" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">Delivers reminders</text>
      <text x="1645" y="684" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#333333;font-style:italic">[SMS/email]</text>
    </g>
  <text x="20" y="1128" text-anchor="start" style="font-size:19px;font-weight:700;fill:#333333;font-style:normal">Container View: OpenMRS Appointment Reminder Platform</text>
  <text x="20" y="1150" text-anchor="start" style="font-size:11px;font-weight:400;fill:#707070;font-style:normal">C4 container means an application or data store, not necessarily a Docker container.</text>
</svg>