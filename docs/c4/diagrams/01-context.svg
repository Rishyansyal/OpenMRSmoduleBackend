      <path d="M 0 0 L 12 5 L 0 10 z" fill="#707070" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  
  <path d="M 350 210 L 560 440" fill="none" stroke="#707070" stroke-width="2" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
<path d="M 350 480 L 560 440" fill="none" stroke="#707070" stroke-width="2" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
