<path d="M 1150 620 L 980 440" fill="none" stroke="#707070" stroke-width="2" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
  
    <circle cx="220" cy="154" r="32" fill="#438d12" stroke="#438d12" stroke-width="2"/>
    <rect x="106" y="192" width="228" height="108" rx="42" fill="#438d12" stroke="#438d12" stroke-width="2"/>
    <text x="220" y="226" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#ffffff;font-style:normal">Clinician</text>
    <text x="220" y="247" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#ffffff;font-style:italic">[Person]</text>
    <text x="220" y="268" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">Uses OpenMRS O3 to manage</text>

    <circle cx="220" cy="424" r="32" fill="#438d12" stroke="#438d12" stroke-width="2"/>
    <rect x="106" y="462" width="228" height="108" rx="42" fill="#438d12" stroke="#438d12" stroke-width="2"/>
    <text x="220" y="496" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#ffffff;font-style:normal">System administrator</text>
    <text x="220" y="517" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#ffffff;font-style:italic">[Person]</text>
    <text x="220" y="538" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">Configures organizations,</text>

    <circle cx="220" cy="694" r="32" fill="#438d12" stroke="#438d12" stroke-width="2"/>
    <rect x="106" y="732" width="228" height="108" rx="42" fill="#438d12" stroke="#438d12" stroke-width="2"/>
    <text x="220" y="766" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#ffffff;font-style:normal">Patient</text>
    <text x="220" y="787" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#ffffff;font-style:italic">[Person]</text>
    <text x="220" y="808" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">Receives appointment</text>

    <g id="platform">
      <rect x="560" y="365" width="420" height="150" rx="0" fill="#85bb57" stroke="#85bb57" stroke-width="2"/>
      <text x="770" y="410" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#ffffff;font-style:normal">OpenMRS Appointment Reminder Platform</text>
      <text x="770" y="432" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#ffffff;font-style:italic">[Software System]</text>
      <text x="770" y="454" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">OpenMRS O3 plus communication backend for</text>
<text x="770" y="468" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">durable 24h and 1h appointment reminders.</text>
    </g>

    <g id="providers">
      <rect x="1150" y="270" width="280" height="140" rx="0" fill="#999999" stroke="#999999" stroke-width="2"/>
      <text x="1290" y="312" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#ffffff;font-style:normal">Messaging provider APIs</text>
      <text x="1290" y="334" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#ffffff;font-style:italic">[External Software System]</text>
      <text x="1290" y="356" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">SwiftSend, SecurePost,</text>
<text x="1290" y="370" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">LegacyLink, and AsyncFlow</text>
<text x="1290" y="384" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">compatible services.</text>
    </g>

    <g id="monitoring">
      <rect x="1150" y="550" width="280" height="140" rx="0" fill="#999999" stroke="#999999" stroke-width="2"/>
      <text x="1290" y="592" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#ffffff;font-style:normal">Monitoring tools</text>
      <text x="1290" y="614" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#ffffff;font-style:italic">[External Software System]</text>
      <text x="1290" y="636" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">Prometheus and Grafana consume</text>
<text x="1290" y="650" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">metrics and logs.</text>
    </g>
  <g>
      <text x="445" y="220" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">Manages clinical</text>
<text x="445" y="234" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">appointment workflow</text>
      <text x="445" y="248" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#333333;font-style:italic">[HTTPS]</text>
    </g>
<g>
      <text x="435" y="455" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">Administers backend</text>
<text x="435" y="469" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">configuration and operations</text>
      <text x="435" y="483" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#333333;font-style:italic">[HTTPS/JWT]</text>
    </g>
<g>
      <text x="1060" y="320" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">Sends reminder delivery</text>
<text x="1060" y="334" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">requests</text>
      <text x="1060" y="348" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#333333;font-style:italic">[HTTPS JSON/XML]</text>
    </g>
<g>
      <text x="760" y="810" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">Delivers reminders</text>
      <text x="760" y="824" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#333333;font-style:italic">[SMS/email]</text>
    </g>
<g>
      <text x="1060" y="590" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">Scrapes metrics and</text>
<text x="1060" y="604" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">reads logs</text>
      <text x="1060" y="618" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#333333;font-style:italic">[HTTP /metrics, stdout]</text>
    </g>
  <text x="20" y="928" text-anchor="start" style="font-size:19px;font-weight:700;fill:#333333;font-style:normal">System Context View: OpenMRS Appointment Reminder Platform</text>
  <text x="20" y="950" text-anchor="start" style="font-size:11px;font-weight:400;fill:#707070;font-style:normal">Reviewed against both codebases. Notation follows the c4model.com boxes-and-lines examples.</text>
</svg>