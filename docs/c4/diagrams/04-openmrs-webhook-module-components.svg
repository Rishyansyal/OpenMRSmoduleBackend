<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 5 L 0 10 z" fill="#707070" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  
    <rect x="370" y="145" width="860" height="780" rx="0" fill="none" stroke="#999999" stroke-width="2" stroke-dasharray="9 9"/>
    <text x="380" y="891" text-anchor="start" style="font-size:13px;font-weight:700;fill:#333333;font-style:normal">OpenMRS Backend</text>
    <text x="380" y="909" text-anchor="start" style="font-size:10px;font-weight:400;fill:#333333;font-style:italic">[Container: OpenMRS 2.8.6, Java/Tomcat]</text>
  <path d="M 565 350 L 565 455" fill="none" stroke="#707070" stroke-width="2" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
<path d="M 695 515 L 865 515" fill="none" stroke="#707070" stroke-width="2" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
<path d="M 995 575 L 780 835" fill="none" stroke="#707070" stroke-width="2" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
<path d="M 865 515 L 695 740" fill="none" stroke="#707070" stroke-width="2" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
<path d="M 435 740 L 320 495" fill="none" stroke="#707070" stroke-width="2" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
<path d="M 1125 515 L 1270 495" fill="none" stroke="#707070" stroke-width="2" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
<path d="M 995 575 L 995 680" fill="none" stroke="#707070" stroke-width="2" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
<path d="M 995 350 L 1190 835" fill="none" stroke="#707070" stroke-width="2" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
<path d="M 1060 895 L 995 800" fill="none" stroke="#707070" stroke-width="2" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
<path d="M 1190 835 L 995 575" fill="none" stroke="#707070" stroke-width="2" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
  
    <g id="api">
      <rect x="1270" y="430" width="270" height="130" rx="0" fill="#85bb57" stroke="#85bb57" stroke-width="2"/>
      <text x="1405" y="470" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#ffffff;font-style:normal">Communication Backend</text>
      <text x="1405" y="492" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#ffffff;font-style:italic">[Container: ASP.NET Core]</text>
      <text x="1405" y="514" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">Receives signed appointment</text>
<text x="1405" y="528" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">webhooks.</text>
    </g>

    <g id="db">
      
    <path d="M 68 452 C 68 434, 312 434, 312 452
             L 312 538
             C 312 556, 68 556, 68 538
             Z" fill="#85bb57" stroke="#85bb57" stroke-width="2"/>
    <ellipse cx="190" cy="452" rx="122" ry="18" fill="#85bb57" stroke="#85bb57" stroke-width="2"/>
    <ellipse cx="190" cy="452" rx="122" ry="18" fill="none" stroke="rgba(0,0,0,0.16)" stroke-width="1"/>
      <text x="190" y="470" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#ffffff;font-style:normal">OpenMRS Database</text>
      <text x="190" y="492" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#ffffff;font-style:italic">[Container: MariaDB]</text>
      <text x="190" y="514" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">Clinical data and global</text>
<text x="190" y="528" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">properties.</text>
    </g>

    <g id="event">
      <rect x="435" y="230" width="260" height="120" rx="0" fill="#85bb57" stroke="#85bb57" stroke-width="2"/>
      <text x="565" y="270" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#ffffff;font-style:normal">OpenMRS Event Module</text>
      <text x="565" y="292" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#ffffff;font-style:italic">[Component: event-api]</text>
      <text x="565" y="314" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">Publishes Encounter events.</text>
    </g>

    <g id="scheduler">
      <rect x="865" y="230" width="260" height="120" rx="0" fill="#85bb57" stroke="#85bb57" stroke-width="2"/>
      <text x="995" y="270" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#ffffff;font-style:normal">OpenMRS Scheduler</text>
      <text x="995" y="292" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#ffffff;font-style:italic">[Component: SchedulerService]</text>
      <text x="995" y="314" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">Runs module retry task.</text>
    </g>

    <g id="listener">
      <rect x="435" y="455" width="260" height="120" rx="0" fill="#85bb57" stroke="#85bb57" stroke-width="2"/>
      <text x="565" y="495" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#ffffff;font-style:normal">Appointment Event Listener</text>
      <text x="565" y="517" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#ffffff;font-style:italic">[Component: Java EventListener]</text>
      <text x="565" y="539" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">Extracts appointment event</text>
<text x="565" y="553" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">data.</text>
    </g>

    <g id="dispatcher">
      <rect x="865" y="455" width="260" height="120" rx="0" fill="#85bb57" stroke="#85bb57" stroke-width="2"/>
      <text x="995" y="495" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#ffffff;font-style:normal">Webhook Dispatcher</text>
      <text x="995" y="517" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#ffffff;font-style:italic">[Component: Java HTTP client]</text>
      <text x="995" y="539" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">Posts signed webhook JSON.</text>
    </g>

    <g id="props">
      <rect x="435" y="680" width="260" height="120" rx="0" fill="#85bb57" stroke="#85bb57" stroke-width="2"/>
      <text x="565" y="720" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#ffffff;font-style:normal">Webhook Properties</text>
      <text x="565" y="742" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#ffffff;font-style:italic">[Component: Global properties]</text>
      <text x="565" y="764" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">Resolves URL, org id,</text>
<text x="565" y="778" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">secret, outbox, retry</text>
<text x="565" y="792" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">interval.</text>
    </g>

    <g id="outbox">
      <rect x="865" y="680" width="260" height="120" rx="0" fill="#85bb57" stroke="#85bb57" stroke-width="2"/>
      <text x="995" y="720" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#ffffff;font-style:normal">File Webhook Outbox</text>
      <text x="995" y="742" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#ffffff;font-style:italic">[Component: JSON Lines file]</text>
      <text x="995" y="764" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">Stores failed dispatches.</text>
    </g>

    <g id="signer">
      <rect x="650" y="835" width="260" height="120" rx="0" fill="#85bb57" stroke="#85bb57" stroke-width="2"/>
      <text x="780" y="875" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#ffffff;font-style:normal">HMAC Signer</text>
      <text x="780" y="897" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#ffffff;font-style:italic">[Component: HmacSHA256]</text>
      <text x="780" y="919" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">Signs timestamp plus raw body.</text>
    </g>

    <g id="retry">
      <rect x="1060" y="835" width="260" height="120" rx="0" fill="#85bb57" stroke="#85bb57" stroke-width="2"/>
      <text x="1190" y="875" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#ffffff;font-style:normal">Webhook Retry Task</text>
      <text x="1190" y="897" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#ffffff;font-style:italic">[Component: Scheduler task]</text>
      <text x="1190" y="919" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#ffffff;font-style:normal">Replays failed outbox entries.</text>
    </g>
  <g>
      <text x="565" y="400" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">Publishes Encounter</text>
<text x="565" y="414" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">events</text>
      <text x="565" y="428" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#333333;font-style:italic">[JMS MapMessage]</text>
    </g>
<g>
      <text x="785" y="500" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">Dispatches normalized</text>
<text x="785" y="514" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">payload</text>
      
    </g>
<g>
      <text x="845" y="765" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">Requests signature</text>
      <text x="845" y="779" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#333333;font-style:italic">[HMAC-SHA256]</text>
    </g>
<g>
      <text x="780" y="650" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">Reads endpoint and</text>
<text x="780" y="664" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">secret</text>
      
    </g>
<g>
      <text x="360" y="640" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">Reads global properties</text>
      <text x="360" y="654" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#333333;font-style:italic">[AdministrationService/JDBC]</text>
    </g>
<g>
      <text x="1210" y="470" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">Posts signed webhook</text>
      <text x="1210" y="484" text-anchor="middle" style="font-size:10px;font-weight:400;fill:#333333;font-style:italic">[HTTPS/JSON + HMAC]</text>
    </g>
<g>
      <text x="1010" y="640" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">Stores failed HTTP</text>
<text x="1010" y="654" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">requests</text>
      
    </g>
<g>
      <text x="1180" y="640" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">Runs retry task</text>
      
    </g>
<g>
      <text x="1030" y="835" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">Reads and rewrites</text>
<text x="1030" y="849" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">entries</text>
      
    </g>
<g>
      <text x="1120" y="650" text-anchor="middle" style="font-size:11px;font-weight:400;fill:#333333;font-style:normal">Retries webhook send</text>
      
    </g>
  <text x="20" y="1028" text-anchor="start" style="font-size:19px;font-weight:700;fill:#333333;font-style:normal">Component View: OpenMRS Appointment Reminder Platform - OpenMRS Backend webhook module</text>
  <text x="20" y="1050" text-anchor="start" style="font-size:11px;font-weight:400;fill:#707070;font-style:normal">The custom OMOD is code inside the OpenMRS Backend container, not a separate C4 container.</text>
</svg>