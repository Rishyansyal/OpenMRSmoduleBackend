services:
  rabbitmq:
    image: rabbitmq:4.1-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    # Security: geen publieke port binding — DB is alleen bereikbaar vanuit het interne
    # Docker-netwerk (backend). Gebruik docker-compose.override.yml voor lokale DB-toegang.
    # ports:
    #   - "${POSTGRES_PORT:-127.0.0.1:5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:?POSTGRES_DB is required};Username=${POSTGRES_USER:?POSTGRES_USER is required};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      Jwt__SecretKey: ${JWT_SECRET:?JWT_SECRET is required}
      Jwt__Issuer: OpenMRSmoduleBackend
      Jwt__Audience: OpenMRSmoduleBackend
      Admin__Email: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      Admin__Password: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      Admin__AllowPublicRegistration: ${ALLOW_PUBLIC_REGISTRATION:-false}
      HospitalConfiguration__FilePath: ${HOSPITAL_CONFIG_FILE_PATH:-}
      Cors__AllowedOrigins: ${ALLOWED_ORIGINS:-http://localhost:3032}
      OpenMrs__BaseUrl: ${OPENMRS_BASE_URL:-http://host.docker.internal:3032}
      OpenMrs__OrganizationId: ${OPENMRS_ORGANIZATION_ID:?OPENMRS_ORGANIZATION_ID is required}
      OpenMrs__Username: ${OPENMRS_USERNAME:-}
      OpenMrs__Password: ${OPENMRS_PASSWORD:-}
      OpenMrs__Poller__Enabled: ${OPENMRS_POLLER_ENABLED:-false}
      OpenMrs__Poller__IntervalMinutes: ${OPENMRS_POLLER_INTERVAL_MINUTES:-5}
      OpenMrs__Poller__LookaheadHours: ${OPENMRS_POLLER_LOOKAHEAD_HOURS:-48}
      OpenMrs__Poller__OrganizationId: ${OPENMRS_ORGANIZATION_ID:?OPENMRS_ORGANIZATION_ID is required}
      Security__EncryptionKey: ${SECURITY_ENCRYPTION_KEY:?SECURITY_ENCRYPTION_KEY is required}
      Encryption__Key: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      Webhooks__OpenMrs__Secret: ${OPENMRS_WEBHOOK_SECRET:-}
      Webhooks__OpenMrs__AllowedClockSkewMinutes: ${OPENMRS_WEBHOOK_ALLOWED_CLOCK_SKEW_MINUTES:-5}
      Messaging__StudentGroup: ${MESSAGING_STUDENT_GROUP:-}
      Messaging__SwiftSend__BaseUrl: ${MESSAGING_PROVIDERS_BASE_URL:-http://host.docker.internal:1337}
      Messaging__SwiftSend__ApiKey: ${MESSAGING_SWIFTSEND_APIKEY:-}
      Messaging__SecurePost__BaseUrl: ${MESSAGING_PROVIDERS_BASE_URL:-http://host.docker.internal:1337}
      Messaging__SecurePost__ClientId: ${MESSAGING_SECUREPOST_CLIENT_ID:-}
      Messaging__SecurePost__ClientSecret: ${MESSAGING_SECUREPOST_CLIENT_SECRET:-}
      Messaging__LegacyLink__BaseUrl: ${MESSAGING_PROVIDERS_BASE_URL:-http://host.docker.internal:1337}
      Messaging__LegacyLink__Username: ${MESSAGING_LEGACYLINK_USERNAME:-}
      Messaging__LegacyLink__Password: ${MESSAGING_LEGACYLINK_PASSWORD:-}
      Messaging__AsyncFlow__BaseUrl: ${MESSAGING_PROVIDERS_BASE_URL:-http://host.docker.internal:1337}
      Messaging__AsyncFlow__ApiKey: ${MESSAGING_ASYNCFLOW_APIKEY:-}
      RabbitMq__Host: ${RABBITMQ_HOST:-rabbitmq}
      RabbitMq__Username: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    ports:
      - "${API_PORT:-127.0.0.1:5111}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

volumes:
  pgdata:
  rabbitmqdata:

networks:
  backend:
    driver: bridge
    internal: false  # API moet naar buiten (extern verkeer); DB niet
