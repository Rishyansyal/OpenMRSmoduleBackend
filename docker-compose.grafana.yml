# Monitoring-overlay voor de OpenMRS Communicatiemodule backend.
# Gebruik samen met het hoofd-compose-bestand zodat Prometheus de backend op
# het interne netwerk kan scrapen:
#
#   docker compose -f docker-compose.yml -f docker-compose.grafana.yml up -d
#
# Grafana: http://localhost:3033  (login: admin / ${GRAFANA_ADMIN_PASSWORD:-admin})
# Prometheus: http://localhost:9090
services:
  prometheus:
    image: prom/prometheus:v3.9.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-127.0.0.1:9090}:9090"
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  grafana:
    image: grafana/grafana:12.3
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LOG_LEVEL: warn
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-127.0.0.1:3033}:3000"
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

volumes:
  prometheusdata:
  grafanadata:
